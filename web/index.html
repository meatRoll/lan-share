<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LanShare Web Desktop</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><p class="eyebrow">LOCAL NETWORK BRIDGE</p><h1>LanShare Web</h1><p>本地服务正在自动发现手机和 TV</p></div><span class="dot">● 已连接本地服务</span></header><section class="devices"><div class="section-head"><h2>附近设备</h2><button id="refresh">重新搜索</button></div><div id="devices" class="device-list"><p class="muted">正在搜索…</p></div></section><section class="drop" id="drop"><div class="upload-icon">↑</div><h2>发送文件到设备</h2><p id="targetHint">请先选择目标设备</p><input id="picker" type="file" multiple disabled><button id="chooseFiles" class="button" type="button" disabled>选择文件</button></section><section><div class="section-head"><h2>这台电脑已接收的文件</h2><button id="reloadFiles">重新加载</button></div><div id="files" class="files"><p class="muted">正在加载…</p></div></section><p id="status" class="status"></p></main><script src="app.js"></script></body></html>
