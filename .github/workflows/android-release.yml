name: Android platform releases

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths: [gradle.properties]

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  detect:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.versions.outputs.matrix }}
      changed: ${{ steps.versions.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test release selection and desktop discovery
        run: |
          python3 scripts/test_release_matrix.py
          node web/discovery-networks.test.js
          node web/discovery.test.js
          node web/ui.test.js
          node web/receive-tcp.test.js
      - id: versions
        name: Compare platform versions across this push
        env:
          BEFORE: ${{ github.event.before }}
        run: python3 scripts/release_matrix.py "${BEFORE:-0000000000000000000000000000000000000000}" >> "$GITHUB_OUTPUT"

  build:
    needs: detect
    if: needs.detect.outputs.changed == 'true'
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.detect.outputs.matrix) }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-33 build-tools;33.0.2'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Prepare signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" && test -n "$KEYSTORE_PASSWORD" && test -n "$KEY_ALIAS" && test -n "$KEY_PASSWORD" || { echo 'Missing Android signing secrets'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lanshare-release.jks"
      - name: Test selected platform
        run: gradle ':app:test${{ matrix.platform == 'phone' && 'Phone' || matrix.platform == 'tvLegacy' && 'TvLegacy' || 'TvModern' }}ReleaseUnitTest' -PenableLogs=true
      - name: Build selected platform
        env:
          LANSHARE_RELEASE_STORE_FILE: ${{ runner.temp }}/lanshare-release.jks
          LANSHARE_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          LANSHARE_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          LANSHARE_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: gradle '${{ matrix.task }}' -PenableLogs=true
      - name: Name APK
        run: |
          mkdir -p dist
          cp 'app/build/outputs/apk/${{ matrix.platform }}/release/app-${{ matrix.platform }}-release.apk' 'dist/LanShare-${{ matrix.platform }}-${{ matrix.version }}.apk'
      - uses: actions/upload-artifact@v4
        with:
          name: LanShare-${{ matrix.platform }}-${{ matrix.version }}
          path: dist/*.apk
          if-no-files-found: error
      - name: Publish platform release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ matrix.platform }}-v${{ matrix.version }}
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            if [[ "$TAG" == *_feat.* ]]; then
              gh release create "$TAG" --target "$GITHUB_SHA" --title "LanShare ${{ matrix.platform }} ${{ matrix.version }}" --notes "Feature test build: configurable discovery subnets and current subnet display. Signed APK built from $GITHUB_SHA. Real-device testing is pending." --prerelease --latest=false
            else
              gh release create "$TAG" --target "$GITHUB_SHA" --title "LanShare ${{ matrix.platform }} ${{ matrix.version }}" --notes "Signed APK for ${{ matrix.platform }}. Built from $GITHUB_SHA." --latest=false
            fi
          fi
          gh release upload "$TAG" dist/*.apk --clobber
      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/lanshare-release.jks"
